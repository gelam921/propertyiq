[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "propertyiq"
version = "0.1.0"
description = "Real estate analytics platform with a built-in data catalog"
requires-python = ">=3.10"
dependencies = ["pandas>=2.0", "pyyaml>=6.0", "typer>=0.12"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff", "mypy", "pandas-stubs", "types-PyYAML"]

[project.scripts]
propertyiq = "propertyiq.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/propertyiq"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100